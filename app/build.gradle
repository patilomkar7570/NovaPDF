plugins {
    id 'com.android.application'
}

android {
    namespace 'app.stillpdf.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'app.stillpdf.reader'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE') ?: "${rootDir}/missing-release-key.jks"
            storeFile file(keystorePath)
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'stillpdf'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Offline PDF text extraction for in-document search. No ads, analytics, or network SDKs.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
