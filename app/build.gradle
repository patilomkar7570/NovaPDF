plugins {
    id 'com.android.application'
}

android {
    namespace 'app.stillpdf.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'app.stillpdf.reader'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Offline PDF text extraction for in-document search. No ads, analytics, or network SDKs.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
