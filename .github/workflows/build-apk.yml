name: Build NOVA PDF Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, "feature/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
          test -s "$RUNNER_TEMP/nova-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nova-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          gradle --no-daemon assembleRelease

      - name: Verify APK signature and prepare release artifact
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK" || { echo "Release APK not found at $RELEASE_APK"; exit 1; }
          
          echo "=== Verifying signature with apksigner ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$RELEASE_APK"
          
          echo "=== Printing certificate details with keytool ==="
          keytool -printcert -jarfile "$RELEASE_APK"
          
          cp "$RELEASE_APK" "app/build/outputs/apk/release/NOVA-PDF-Android-v1.0.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PDF-Android-v1.0.apk
          path: app/build/outputs/apk/release/NOVA-PDF-Android-v1.0.apk
          if-no-files-found: error
          retention-days: 30
