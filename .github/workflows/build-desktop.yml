name: Build NOVA PDF Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [ main, master, "feature/**" ]
    paths:
      - 'desktop/**'
      - 'assets/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build React and Electron
        run: npm run build

      - name: Package with electron-builder
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Windows Installer Output
        run: |
          Get-ChildItem -Path release -Filter "*.exe" | Select-Object Name, Length, FullName
          $installer = Get-ChildItem -Path release -Filter "NOVA-PDF-Windows-Setup-v*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer was not found in release folder!"
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName)"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PDF-Windows-Setup-v1.0.0.exe
          path: desktop/release/NOVA-PDF-Windows-Setup-v1.0.0.exe
          if-no-files-found: error
          retention-days: 30
